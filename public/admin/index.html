<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firefly博客管理系统 | zhanxx81201.dpdns.org</title>
    
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    
    <!-- Bootstrap中文美化 -->
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- 中文优化配置 -->
    <script>
        window.CMS_MANUAL_INIT = true;
        
        document.addEventListener('DOMContentLoaded', function() {
            // 等待CMS加载完成后设置中文
            const checkCMS = setInterval(function() {
                if (window.CMS && window.CMS.registerLocale) {
                    clearInterval(checkCMS);
                    
                    // 注册中文语言包
                    window.CMS.registerLocale('zh', {
                        "app": {
                            "header": {
                                "content": "内容",
                                "media": "媒体",
                                "quickAdd": "快速添加"
                            },
                            "app": {
                                "loading": "加载中...",
                                "error": "错误"
                            },
                            "notifications": {
                                "onChangesToDeployedBranch": "修改将保存到GitHub"
                            }
                        },
                        "collection": {
                            "sidebar": {
                                "collections": "集合",
                                "searchAll": "搜索所有内容"
                            },
                            "top": {
                                "viewAs": "查看方式",
                                "newButton": "新建 %{collectionLabel}"
                            }
                        },
                        "editor": {
                            "editorControl": {
                                "save": "保存",
                                "delete": "删除"
                            }
                        }
                    });
                    
                    // 初始化CMS
                    window.CMS.init({
                        config: {
                            locale: 'zh'
                        }
                    });
                    
                    // 隐藏加载动画
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('cms-root').style.opacity = '1';
                }
            }, 100);
        });
    </script>
    
    <!-- 自定义样式 -->
    <style>
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .header-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-left: 5px solid #667eea;
        }
        
        .header-card h1 {
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .header-card p {
            color: #666;
            margin-bottom: 0;
        }
        
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            color: white;
            text-align: center;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        .tip-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            max-width: 600px;
            backdrop-filter: blur(10px);
        }
        
        .tip-card h4 {
            color: white;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .tip-card ul {
            text-align: left;
            color: rgba(255,255,255,0.9);
            padding-left: 20px;
            margin-bottom: 0;
        }
        
        .tip-card li {
            margin-bottom: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #cms-root {
            opacity: 0;
            transition: opacity 0.5s ease;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <!-- 加载动画 -->
    <div class="loading-container" id="loading">
        <div class="loader"></div>
        <h2 class="mb-3">正在加载博客管理系统...</h2>
        <div class="tip-card">
            <h4>📝 使用说明</h4>
            <ul>
                <li>首次使用需要登录GitHub账号授权</li>
                <li>文章会自动保存到你的GitHub仓库</li>
                <li>Cloudflare Pages会自动重新部署</li>
                <li>编辑现有文章时，请勿修改已有字段名称</li>
                <li>建议使用Chrome或Edge浏览器</li>
            </ul>
        </div>
    </div>
    
    <!-- 标题卡片 -->
    <div id="cms-root">
        <div class="container">
            <div class="header-card">
                <h1>🏠 Firefly博客管理系统</h1>
                <p>网站地址: <strong>zhanxx81201.dpdns.org</strong> | GitHub仓库: <strong>zuqiu2024/zxx</strong> | 分支: <strong>master</strong></p>
                <small class="text-muted">基于Decap CMS，您的文章将自动保存到GitHub</small>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
