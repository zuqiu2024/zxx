backend:
  name: github
  repo: 你的GitHub用户名/你的仓库名  # 例如：zhanxx81201/firefly-blog
  branch: main
  base_url: https://zhanxx81201.dpdns.org
  auth_endpoint: api/auth

# 媒体文件存储
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# 内容集合 - 匹配你的posts目录
collections:
  - name: "posts"  # 重要：这里必须是"posts"
    label: "博客文章"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    format: "frontmatter-md"
    extension: "md"
    
    # 排序方式：按发布日期倒序
    sortable_fields: ["pubDate"]
    sort: "pubDate"
    order: "descending"
    
    # 文章字段 - 根据Firefly主题的格式
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: "HH:mm", required: true }
      - { label: "更新日期", name: "updatedDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: "HH:mm", required: false }
      - { label: "描述", name: "description", widget: "string", required: false }
      - { label: "标签", name: "tags", widget: "list", default: [], required: false }
      - { label: "封面图片", name: "featuredImage", widget: "image", required: false }
      - { label: "是否草稿", name: "draft", widget: "boolean", default: false }
      
      # 正文内容
      - label: "正文内容"
        name: "body"
        widget: "markdown"
        buttons: 
          - heading
          - bold
          - italic
          - link
          - code
          - bulleted-list
          - numbered-list
          - quote
          - image
          - code-block
        editor_components: 
          - image
          - code-block