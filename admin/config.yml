backend:
  name: github
  repo: zuqiu2024/zxx
  branch: master
  base_url: https://zhanxx81201.dpdns.org
  auth_endpoint: /api/auth

media_folder: "public/images"
public_folder: "/images"

# 网站信息
site_url: https://zhanxx81201.dpdns.org
display_url: https://zhanxx81201.dpdns.org

# 内容集合
collections:
  - name: "posts"
    label: "博客文章"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    format: "frontmatter-md"
    extension: "md"
    
    # 按发表日期排序
    sortable_fields: ["published"]
    sort: "published"
    order: "descending"
    
    # 字段配置（完全匹配你的文章格式）
    fields:
      - { label: "标题", name: "title", widget: "string", required: true }
      
      - label: "发布日期"
        name: "published"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        default: "{{now}}"
        required: true
      
      - { label: "是否置顶", name: "pinned", widget: "boolean", default: false }
      
      - { label: "描述", name: "description", widget: "text" }
      
      - label: "标签"
        name: "tags"
        widget: "list"
        allow_add: true
        field: { label: "标签", name: "value", widget: "string" }
        required: false
      
      - { label: "分类", name: "category", widget: "string" }
      
      - { label: "是否草稿", name: "draft", widget: "boolean", default: false }
      
      - label: "封面图片"
        name: "image"
        widget: "string"
        required: false
        hint: "支持 ./images/xxx.webp 或完整URL"
      
      - { label: "作者", name: "author", widget: "string", default: "展" }
      
      - label: "正文内容"
        name: "body"
        widget: "markdown"
        buttons: 
          - heading
          - bold
          - italic
          - link
          - code
          - bulleted-list
          - numbered-list
          - quote
        required: true