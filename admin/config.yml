backend:
  name: github
  repo: zuqiu2024/zxx # 你的仓库：用户名/仓库名
  branch: master # 你的主分支名称
  base_url: https://api.decapcms.org
  auth_type: implicit
  app_id: Ov23liGigiiDAG1BycQ3 # 请替换为你在GitHub OAuth App获得的真实 Client ID
  site_domain: https://zhanxx81201.dpdns.org # 你的博客访问地址

# 媒体文件（如图片）将存储在这里
media_folder: "public/assets/images/uploads" # 上传文件在仓库中的存放路径
public_folder: "/assets/images/uploads" # 网站访问这些文件的公开路径

# 内容集合定义（这里对应你的博客文章）
collections:
  - name: "posts" # 集合名称，对应 `src/content/posts` 目录
    label: "文章"
    label_singular: "文章"
    folder: "src/content/posts" # 文章Markdown文件的存储路径
    create: true # 允许在后台创建新文章
    delete: true # 允许在后台删除文章
    slug: "{{slug}}" # 使用文章标题自动生成文件名
    editor:
      preview: false # 在编辑器中关闭预览（可选）
    fields: # 定义文章的可编辑字段，对应你Frontmatter里的项
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "published", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "摘要", name: "description", widget: "text" }
      - { label: "封面图", name: "image", widget: "image", required: false }
      - { label: "作者", name: "author", widget: "string", default: "展" }
      - { label: "标签", name: "tags", widget: "list", default: ["班级风采", "校园"], allow_add: true }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }
