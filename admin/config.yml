backend:
  name: github
  repo: zuqiu2024/zxx
  branch: master
  base_url: https://zhanxx81201.dpdns.org
  auth_endpoint: api/auth

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "博客文章"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    format: "frontmatter-md"
    extension: "md"
    
    # 排序方式
    sortable_fields: ["published"]
    sort: "published"
    order: "descending"
    
    # 字段配置（完全匹配你的文章格式）
    fields:
      # 标题
      - label: "标题"
        name: "title"
        widget: "string"
        required: true
        pattern: ['.{3,}', '标题至少需要3个字符']
      
      # 发布日期
      - label: "发布日期"
        name: "published"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        default: "{{now}}"
        required: true
      
      # 是否置顶
      - label: "是否置顶"
        name: "pinned"
        widget: "boolean"
        default: false
        required: false
      
      # 描述
      - label: "文章描述"
        name: "description"
        widget: "text"
        required: false
        hint: "文章简短描述，用于SEO和文章列表展示"
      
      # 标签（两种格式都支持）
      - label: "文章标签"
        name: "tags"
        widget: "list"
        allow_add: true
        collapsed: false
        field: 
          label: "标签名"
          name: "tag"
          widget: "string"
        required: false
      
      # 分类
      - label: "文章分类"
        name: "category"
        widget: "string"
        required: false
      
      # 是否草稿
      - label: "是否草稿"
        name: "draft"
        widget: "boolean"
        default: false
        required: false
      
      # 封面图片
      - label: "封面图片"
        name: "image"
        widget: "image"
        required: false
        choose_url: true
        hint: "上传图片或输入图片URL"
        media_library:
          config:
            multiple: false
      
      # 作者
      - label: "作者"
        name: "author"
        widget: "string"
        default: "展"
        required: false
      
      # 正文内容
      - label: "正文内容"
        name: "body"
        widget: "markdown"
        buttons: 
          - heading
          - bold
          - italic
          - link
          - code
          - bulleted-list
          - numbered-list
          - quote
          - image
          - code-block
        editor_components: 
          - image
          - code-block
        required: true
        hint: "支持Markdown和Firefly特殊语法，如 ::github{repo='...'}"